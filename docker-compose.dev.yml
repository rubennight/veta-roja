# Postgres solo para desarrollo. Alternativa: cualquier Postgres 16+ local.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vetaroja
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["54329:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: ["postgres"]
volumes:
  pgdata:
